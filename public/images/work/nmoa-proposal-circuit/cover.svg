<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NMOA Proposal Ecosystem Cover</title>
  <desc id="desc">A circuit-like diagram showing the museum's proposal system as interconnected nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="150" y1="90" x2="1450" y2="1110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4E8D8"/>
      <stop offset="0.55" stop-color="#ECE0D1"/>
      <stop offset="1" stop-color="#DDD0BE"/>
    </linearGradient>
    <linearGradient id="panel" x1="170" y1="140" x2="740" y2="1060" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1A16"/>
      <stop offset="1" stop-color="#342C24"/>
    </linearGradient>
    <linearGradient id="line" x1="800" y1="200" x2="1350" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E362E"/>
      <stop offset="1" stop-color="#6B5841"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 620) rotate(90) scale(350 350)">
      <stop offset="0" stop-color="#C98B3E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C98B3E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2B2116" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect x="92" y="92" width="1416" height="1016" rx="44" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="92" y="92" width="1416" height="1016" rx="44" fill="none" stroke="#9D7B50" stroke-opacity="0.36" stroke-width="2"/>

  <circle cx="1125" cy="610" r="245" fill="url(#glow)"/>
  <circle cx="1096" cy="610" r="128" fill="#F4E9DA" fill-opacity="0.08"/>
  <circle cx="1096" cy="610" r="96" fill="#F4E9DA" fill-opacity="0.18"/>
  <circle cx="1096" cy="610" r="54" fill="#F4E9DA" fill-opacity="0.9"/>
  <circle cx="1096" cy="610" r="20" fill="#1E1A16" fill-opacity="0.95"/>

  <path d="M1096 556V356" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1096 664V864" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1042 610H840" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1150 610H1354" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1020 534 872 396" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1172 686 1322 832" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1020 686 872 822" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M1174 534 1322 398" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>

  <g fill="#F2E7D7" fill-opacity="0.96" stroke="#1E1A16" stroke-opacity="0.22" stroke-width="2">
    <circle cx="840" cy="610" r="44"/>
    <circle cx="1354" cy="610" r="44"/>
    <circle cx="872" cy="396" r="44"/>
    <circle cx="1322" cy="398" r="44"/>
    <circle cx="872" cy="822" r="44"/>
    <circle cx="1322" cy="832" r="44"/>
    <circle cx="1096" cy="356" r="44"/>
    <circle cx="1096" cy="864" r="44"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif" fill="#F6EFE6">
    <text x="182" y="250" font-size="94" font-weight="600" letter-spacing="-0.04em">NMOA</text>
    <text x="182" y="320" font-size="34" font-weight="500" letter-spacing="0.16em" opacity="0.82">PROPOSAL ECOSYSTEM</text>
    <text x="182" y="412" font-size="24" font-weight="400" opacity="0.82">Money / staff / public energy / access / hidden knowledge</text>
    <text x="182" y="456" font-size="24" font-weight="400" opacity="0.82">one circuit, several pressures</text>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" letter-spacing="0.06em" fill="#F6EFE6" opacity="0.82">
    <text x="756" y="610" text-anchor="end">Funding</text>
    <text x="1438" y="610">Staff</text>
    <text x="872" y="336" text-anchor="middle">Public</text>
    <text x="1322" y="344" text-anchor="middle">Access</text>
    <text x="872" y="894" text-anchor="middle">Knowledge</text>
    <text x="1322" y="904" text-anchor="middle">Trust</text>
  </g>
</svg>
