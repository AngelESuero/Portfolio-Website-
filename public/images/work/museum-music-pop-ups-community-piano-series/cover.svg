    <rect x="1018" y="754" width="28" height="64" rx="5" fill="#F8EFE2"/>
    <rect x="1050" y="754" width="28" height="64" rx="5" fill="#F8EFE2"/>
    <rect x="1082" y="754" width="28" height="64" rx="5" fill="#F8EFE2"/>
