    <text x="204" y="424" font-size="34" font-weight="500" letter-spacing="0.18em" opacity="0.82">COMMUNITY PIANO</text>
    <text x="204" y="474" font-size="24" font-weight="400" opacity="0.82">pop-ups / live series / public rhythm</text>
