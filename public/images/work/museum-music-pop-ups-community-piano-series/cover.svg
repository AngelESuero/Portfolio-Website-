<svg width="1600" height="1200" viewBox="0 0 1600 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Museum Music Pop-Ups Cover</title>
  <desc id="desc">A piano and sound-wave motif for a community music series.</desc>
  <defs>
    <linearGradient id="bg" x1="130" y1="100" x2="1470" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7EFE4"/>
      <stop offset="0.55" stop-color="#ECDCC7"/>
      <stop offset="1" stop-color="#DCC5AA"/>
    </linearGradient>
    <linearGradient id="panel" x1="170" y1="150" x2="700" y2="1040" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#221D24"/>
      <stop offset="1" stop-color="#3B2F36"/>
    </linearGradient>
    <linearGradient id="wave" x1="780" y1="360" x2="1390" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BC775E"/>
      <stop offset="1" stop-color="#E0A24E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1130 630) rotate(90) scale(360 360)">
      <stop offset="0" stop-color="#D08A4D" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#D08A4D" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#2A1E18" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect x="88" y="92" width="1424" height="1016" rx="44" fill="#F1E5D4" filter="url(#shadow)"/>
  <rect x="88" y="92" width="1424" height="1016" rx="44" fill="none" stroke="#B89061" stroke-opacity="0.28" stroke-width="2"/>

  <rect x="150" y="150" width="560" height="900" rx="38" fill="url(#panel)"/>
  <rect x="150" y="150" width="560" height="900" rx="38" fill="none" stroke="#D4B18B" stroke-opacity="0.18" stroke-width="2"/>

  <circle cx="1100" cy="634" r="248" fill="url(#glow)"/>
  <path d="M900 478C958 448 1018 438 1080 444C1146 450 1208 472 1272 508C1332 542 1382 558 1418 556" stroke="url(#wave)" stroke-width="12" stroke-linecap="round"/>
  <path d="M900 548C958 518 1018 510 1080 516C1146 522 1208 544 1272 580C1332 614 1382 630 1418 628" stroke="url(#wave)" stroke-opacity="0.7" stroke-width="10" stroke-linecap="round"/>
  <path d="M900 618C958 588 1018 580 1080 586C1146 592 1208 614 1272 650C1332 684 1382 700 1418 698" stroke="url(#wave)" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>

